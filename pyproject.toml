[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "orchestrate-everything-with-agents"
version = "1.2.0"
description = "A lightweight personal platform for developing, orchestrating and collaborating with agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "apsw>=3.51.3.0,<4",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "cryptography>=43,<51",
  "jsonschema>=4.21,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
mcp = ["mcp>=1.30,<2"]
langgraph = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=2,<4"]
workbench = ["Pillow>=10,<13"]

[project.scripts]
oea = "ma_runtime.cli:main"
multi-agent = "ma_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oea", "src/ma_runtime", "agent"]

[tool.hatch.build.targets.sdist]
exclude = ["/skills", "/mcp", "/PROJECT_SPEC.md", "/AGENTS.md"]
include = ["src/", "agent/", "docs/", "examples/", "tests/", "integrations/", "scripts/", ".github/", "README.md", "README.zh-CN.md", "CONTRIBUTING.md", "SECURITY.md", "LICENSE", "pyproject.toml", "constraints.txt", "Start-Workspace.ps1", "Start-Workspace.cmd", ".gitignore", ".gitattributes"]
