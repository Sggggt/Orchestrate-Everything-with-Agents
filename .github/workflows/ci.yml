name: Contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -c constraints.txt -e ".[web,mcp]"
      - run: python -B -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/test_markdown.mjs tests/test_workflow_graph.mjs
      - run: python -B scripts/check_release.py
