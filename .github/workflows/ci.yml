name: Contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -c constraints.txt -e ".[web,mcp,workbench]"
      - name: Run Python contracts
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Run JavaScript contracts
        shell: python {0}
        run: |
          from pathlib import Path
          import subprocess
          tests = sorted(str(path) for path in Path("tests").glob("test_*.mjs"))
          subprocess.run(["node", "--test", *tests], check=True)
      - run: python -B scripts/check_release.py
