name: Bug report
description: Report a reproducible platform problem
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide minimal code that generates generic inputs locally. Do not attach datasets, logs, captures, tokens, personal paths or private records.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Platform version, Python version and operating system
